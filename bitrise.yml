        - channel_on_error: "$SLACK_CHANNEL"
        - emoji_on_error: ":sob:"
        - from_username_on_error: React Native Min App
        - buttons: |
            View App|${BITRISE_APP_URL}
            View Build|${BITRISE_BUILD_URL}
            App Center Android|${APPCENTER_URL_ANDROID}
            App Center iOS|${APPCENTER_URL_IOS}
        - pretext: "*:tada: Build Succeeded! :tada:*"
