        - podfile_path: "$BITRISE_SOURCE_DIR/ios/Podfile"
        - source_root_path: "$BITRISE_SOURCE_DIR/ios"
        is_always_run: true
    - set-xcode-build-number@2:
        inputs:
        - build_short_version_string: "$NPM_PACKAGE_VERSION"
        - plist_path: "$IOS_INFO_PLIST"
        is_always_run: true
    - xcode-archive@6.1.2:
        inputs:
        - automatic_code_signing: api-key
        - compile_bitcode: 'no'
        - upload_bitcode: 'no'
        - configuration: Release
        - distribution_method: ad-hoc
        is_always_run: true
    - deploy-to-bitrise-io@2:
        inputs:
        - is_enable_public_page: 'false'
        - notify_user_groups: none
  # Temporary iOS-only workflow; remove after migrating the shared workflows to Xcode 27.
  min-app-xcode-27:
    description: Build the React Native Minimal App for TestFlight with Xcode 27.
    meta:
      bitrise.io:
        stack: osx-xcode-27.0.x-edge
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - nvm@1:
        inputs:
        - node_version: 24.11.0
    - script@1:
        title: Run npm install
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            npm install
    - script@1:
        title: Extract NPM version
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            npm_package_version=$(jq -r '.expo.version' "$MAIN_VERSION_JSON_FILE")
            if [[ -z "$npm_package_version" || "$npm_package_version" == "null" ]]; then
              echo "Could not extract the app version from $MAIN_VERSION_JSON_FILE"
              exit 1
            fi

            echo "Found package version: $npm_package_version"
            envman add --key NPM_PACKAGE_VERSION --value "$npm_package_version"
    - script@1:
        title: Parse Release notes
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            envman add --key RELEASE_NOTES --valuefile "$APP_RELEASE_NOTES_FILE"
            echo "Using main app release notes"
    - script@1:
        title: Remove repository Ruby version pin
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            rm -f "$BITRISE_SOURCE_DIR/.ruby-version"
            unset RBENV_VERSION
    - cocoapods-install@3.1.1:
        inputs:
        - verbose: 'true'
        - podfile_path: "$BITRISE_SOURCE_DIR/ios/Podfile"
        - source_root_path: "$BITRISE_SOURCE_DIR/ios"
    - script@1:
        title: Set CocoaPods iOS deployment target
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

                        pods_project="$BITRISE_SOURCE_DIR/ios/Pods/Pods.xcodeproj/project.pbxproj"
                        app_project="$BITRISE_SOURCE_DIR/ios/RNPointSDKMinimalIntegration.xcodeproj/project.pbxproj"

                        for project_file in "$pods_project" "$app_project"; do
                            if [[ ! -f "$project_file" ]]; then
                                echo "Xcode project not found: $project_file"
                                exit 1
                            fi

                            /usr/bin/perl -0pi -e 's/(IPHONEOS_DEPLOYMENT_TARGET = )[0-9.]+;/${1}15.6;/g' "$project_file"
                        done
    - script@1:
        title: Build fmt with C++17 for Xcode 27
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail

            ruby - "$BITRISE_SOURCE_DIR/ios/Pods/Pods.xcodeproj" <<'RUBY'
            require 'xcodeproj'

            project = Xcodeproj::Project.open(ARGV.fetch(0))
            fmt_target = project.targets.find { |target| target.name == 'fmt' }
            abort 'fmt target not found in Pods.xcodeproj' unless fmt_target

            fmt_target.build_configurations.each do |configuration|
              configuration.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++17'
            end

            project.save
            RUBY
    - set-xcode-build-number@2:
        inputs:
        - build_short_version_string: "$NPM_PACKAGE_VERSION"
        - plist_path: "$IOS_INFO_PLIST"
    - xcode-archive@6.1.2:
        title: Archive for TestFlight
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - automatic_code_signing: api-key
        - compile_bitcode: 'no'
        - upload_bitcode: 'no'
        - configuration: Release
        - distribution_method: app-store
    - deploy-to-itunesconnect-deliver@2:
        title: Deploy to TestFlight
        inputs:
        - connection: api_key
        - app_id: "$APPSTORE_ID"
        - distribute_external: 'no'
    - deploy-to-bitrise-io@2:
        inputs:
        - is_enable_public_page: 'false'
        - notify_user_groups: none
meta:
  bitrise.io:
    stack: osx-xcode-26.2.x
    machine_type_id: g2.mac.medium
app:
  envs:
  - opts:
      is_expand: false
    GRADLEW_PATH: "./android/gradlew"
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: "./ios/RNPointSDKMinimalIntegration.xcworkspace"
  - opts:
      is_expand: false
    BITRISE_SCHEME: RNPointSDKMinimalIntegration
  - opts:
      is_expand: false
    IOS_INFO_PLIST: "./ios/RNPointSDKMinimalIntegration/Info.plist"
  - opts:
      is_expand: false
    PLUGIN_RELEASE_NOTES_FILE: "./node_modules/bluedot-react-native/ReleaseNotes.md"
  - opts:
      is_expand: false
    APP_RELEASE_NOTES_FILE: "./ReleaseNotes.md"
  - opts:
      is_expand: false
    MAIN_VERSION_JSON_FILE: "./app.json"
  - opts:
      is_expand: false
    PLUGIN_VERSION_JSON_FILE: "./node_modules/bluedot-react-native/package.json"
  - GRADLE_OPTS: "-Xmx4096m"
    opts:
      is_expand: false
