    - set-java-version@1:
        inputs:
        - set_java_version: '17'
    - install-missing-android-tools@3.5.1: {}
    - file-downloader@2.0.0:
        inputs:
        - source: "$BITRISEIO_GOOGLE_SERVICE_JSON_URL"
        - destination: "./android/app/google-services.json"
    - file-downloader@2.0.0:
        inputs:
        - source: "$BITRISEIO_AIRSHIP_CONFIG_URL"
        - destination: "./android/app/src/main/assets/airshipconfig.properties"
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            cd $BITRISE_SOURCE_DIR
            rm -rf android/.cxx android/build android/app/build

            cd $BITRISE_SOURCE_DIR/android
            ./gradlew clean \
                generateAutolinkingPackageList \
                generateCodegenArtifactsFromSchema \
                -PnewArchEnabled=true
            # or run a script from your repository, like:
            # bash ./path/to/script.sh
            # not just bash, e.g.:
            # ruby ./path/to/script.rb
