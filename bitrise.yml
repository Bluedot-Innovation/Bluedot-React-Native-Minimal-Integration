---
format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native
workflows:
  testing:
    description: |
      Installs dependencies.

      Next steps:
      - Add tests to your project and configure the workflow to run them.
      - Check out [Getting started with Expo apps](https://devcenter.bitrise.io/en/getting-started/getting-started-with-expo-apps.html).
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - cache-pull@2: {}
    - script@1:
        title: Set variable isTag
        inputs:
        - content: |-
            #!/usr/bin/env bash

            DOWNSTREAM_TAG_PATTERN='^v[0-9]+\.[0-9]+(\.[0-9])?-pre\+build+\.[0-9]+$'

            is_downstream=false
            if [[ "$BITRISE_GIT_TAG" =~ $DOWNSTREAM_TAG_PATTERN ]]; then
                is_downstream=true
            fi

            envman add --key IS_DOWNSTREAM_BUILD --value "$is_downstream"
            echo $is_downstream
            echo $IS_DOWNSTREAM_BUILD
    - script@1:
        title: 18.0.0 Inject google-services.json
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "$GOOGLE_SERVICES_JSON" > "$BITRISE_SOURCE_DIR/android/app/google-services.json"
            echo "google-services.json written successfully."
    - script@1:
        title: Run npm install
        inputs:
        - content: |+
            #!/usr/bin/env bash

            # first delete package-lock.json file to avoid issue when the locked versions are of different architecture e.g. arm64 M1 chip but CI is amd
            # rm -f package-lock.json

            # first do a normal npm install
            npm install

            # if this is a downstream build from a tag, fetch plugin version from that tag
            NPM_INSTALL_PARAM=
            if "$IS_DOWNSTREAM_BUILD" = "true"; then
                NPM_INSTALL_PARAM="git+ssh://git@github.com/Bluedot-Innovation/Bluedot-React-Native-Plugin.git#$BITRISE_GIT_TAG"
                echo $NPM_INSTALL_PARAM
                npm install $NPM_INSTALL_PARAM
            fi


    - script@1:
        title: Extract NPM version
        inputs:
        - content: "#!/usr/bin/env bash


            # If Main app, version is from app.json file, version is nested in
            expo map

            # If Downstream build, use version from plugin's package.json file,
            version is at the root map\ 

            VERSION_FIELD=.expo.version

            VERSION_JSON_FILE=$MAIN_VERSION_JSON_FILE


            # If need to use Plugin's version for the Main App, uncomment the if
            condition below

            #if \"$IS_DOWNSTREAM_BUILD\" = \"true\"; then

            #    VERSION_FIELD=.version

            #    VERSION_JSON_FILE=$PLUGIN_VERSION_JSON_FILE

            #fi



            NPM_PACKAGE_VERSION=$(cat \"$VERSION_JSON_FILE\" | jq -r
            \"$VERSION_FIELD\")


            echo \"Found package version: ${NPM_PACKAGE_VERSION}\"


            envman add --key NPM_PACKAGE_VERSION --value
            \"${NPM_PACKAGE_VERSION}\""
    - script@1:
        title: Parse Release notes
        inputs:
        - content: |-
            #!/usr/bin/env bash

            SEDOPTION="-i"
            if [[ "$OSTYPE" == "darwin"* ]]; then
              SEDOPTION="-i ''"
            fi

            USE_PLUGIN_RELEASE_NOTES=false
            if "$IS_DOWNSTREAM_BUILD" = "true" && test -f "$PLUGIN_RELEASE_NOTES_FILE"; then
                USE_PLUGIN_RELEASE_NOTES=true
            fi

            if [ "$USE_PLUGIN_RELEASE_NOTES" = true ]; then
                echo 'Use Plugin Release Notes'
                # insert a note saying this is a Downstream build
                sed $SEDOPTION "1s/^/Downstream build, plugin version: \`$NPM_PACKAGE_VERSION\` \n&/" "$PLUGIN_RELEASE_NOTES_FILE"
                envman add --key RELEASE_NOTES --valuefile $PLUGIN_RELEASE_NOTES_FILE
            else
                echo 'Use Main App Release Notes'
                sed $SEDOPTION "1s/^/Min App build version: \`$NPM_PACKAGE_VERSION\` \n&/" "$APP_RELEASE_NOTES_FILE"
                envman add --key RELEASE_NOTES --valuefile $APP_RELEASE_NOTES_FILE
            fi

            echo $RELEASE_NOTES
    - set-java-version@1:
        inputs:
        - set_java_version: '21'
    - nvm@1:
        inputs:
        - node_version: 24.11.0
    - install-missing-android-tools@3.2: {}
    - change-android-versioncode-and-versionname@1:
        inputs:
        - new_version_name: "$NPM_PACKAGE_VERSION"
        - build_gradle_path: "$BITRISE_SOURCE_DIR/android/app/build.gradle"
    - android-build@1:
        inputs:
        - module: app
        - arguments: ''
        - variant: release
        - project_location: "$BITRISE_SOURCE_DIR/android"
    - script@1:
        title: Remove existing pods
        inputs:
        - content: |-
            #!/usr/bin/env bash
            rm -f ./ios/Podfile.lock
    - script@1:
        title: Setup Ruby 3.3.1 with asdf
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            rm -f "$BITRISE_SOURCE_DIR/.ruby-version"
            unset RBENV_VERSION
            RUBY_VERSION=3.3.1
            asdf install ruby $RUBY_VERSION
            asdf global ruby $RUBY_VERSION
    - cocoapods-install@2:
        inputs:
        - verbose: 'true'
        - podfile_path: "$BITRISE_SOURCE_DIR/ios/Podfile"
        - source_root_path: "$BITRISE_SOURCE_DIR/ios"
    - set-xcode-build-number@2:
        inputs:
        - build_short_version_string: "$NPM_PACKAGE_VERSION"
        - plist_path: "$IOS_INFO_PLIST"
    - xcode-archive@5:
        inputs:
        - automatic_code_signing: api-key
        - compile_bitcode: 'no'
        - upload_bitcode: 'no'
        - configuration: Release
        - distribution_method: ad-hoc
    - cache-push@2: {}
    - deploy-to-bitrise-io@2:
        inputs:
        - is_enable_public_page: 'false'
        - notify_user_groups: none
