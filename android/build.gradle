// Top-level build file where you can add configuration options common to all sub-projects/modules.

// DEV ONLY - we use local properties to load sdk internal release - remove it in production. 
// Load secrets from local.properties so they are available via project.findProperty()
// without being committed to version control.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
    localProperties.each { key, value -> project.ext.set(key as String, value) }
}

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 29
        compileSdkVersion = 36
        targetSdkVersion = 36

        ndkVersion = "27.3.13750724"
        kotlinVersion = "2.3.0"
        composeVersion = "1.5.4"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.13.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("androidx.compose.compiler:compiler:${composeVersion}")
        classpath('com.google.gms:google-services:4.4.2') // required if push notifications are enabled with android/gradle.properties/bluedotPushEnabled=true
    }
}
