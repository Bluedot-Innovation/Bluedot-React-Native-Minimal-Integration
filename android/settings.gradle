pluginManagement {
	includeBuild("../node_modules/@react-native/gradle-plugin")

	def expoAutolinkingPackageJsonPath = [
			"node",
			"--print",
			"require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"
	].execute(null, rootDir).text.trim()

	includeBuild(new File(expoAutolinkingPackageJsonPath).parentFile.toString() + "/android/expo-gradle-plugin")
}
plugins {
	id("com.facebook.react.settings")
	id("expo-autolinking-settings")
}
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
expoAutolinking.useExpoModules()
rootProject.name = 'RNPointSDKMinimalIntegration'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
